  Definitely the best hunter as of right now but will get outclassed soon. Has many abilities allowing different attack types (polearm, axe, wind, lightning, light) but doesn't do well getting those weaknesses other than bow. Got buffed compared to JP side. Double cast passive when breaking enemies for 2 turns.

# Strategic analysis from YouTube tutorial
usage_strategy: |
  Ochette is in same boat as Partio - best hunter currently but will be outclassed. Her buffs are nice but more like sprinkles on top. Double cast passive only lasts 2 turns and she becomes designated enemy breaker, meaning you need to equip her with accessories that give enemy debuffs upon breaks. Six-hit random target bow attack is highest guaranteed bow attacks we've seen.


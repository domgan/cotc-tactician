  Alrond is a luxury unit between must-have and optional. His main gimmick is supporting the team's ultimate bar with 40% restoration each turn plus immediate fill with his ultimate. For new players, he can break all physical weaknesses and light single-handedly. For seasoned players, he enables quicker ultimate cycling. His skills are similar to EX Primrose (ultimate support) and Bargello (ultimate battery) but with superior breaking capabilities. Consider holding pulls if you have EX Primrose or Bargello, as he's a Side Story memory traveler with future reruns.


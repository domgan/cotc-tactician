# Usage Strategy Notes (from YouTube tutorial)
usage_strategy: |
  OVERALL ASSESSMENT:
  - Disappointment overall, kit too demanding of specific travelers
  - Mediocre despite global buffs
  - Skip for most players, especially with Kainé/Tiziano meta

  STRENGTHS:
  - Follow-up passive: Allies using lightning attacks get +1 AoE lightning damage + shock infliction
  - Six-star passive: Up to 200% potency boost on broken enemies with lightning team
  - Can hit up to 9 times with buffed skills (5 hits + 3 follow-up + 1 passive)
  - Decently high elemental attack (505 at Lv120)

  WEAKNESSES:
  - Average F2P players lack sufficient lightning travelers
  - Asel and Isla are main lightning users but don't specialize in lightning damage
  - Lightning weakness implant on A4 is useless as she can't do it herself
  - Outclassed by physical damage meta

  TEAM REQUIREMENTS:
  - Needs 3+ lightning users in front row for maximum potency
  - Osvald, Isla, and other lightning specialists essential
  - Not worth building team around for most players

  COMPARISON:
  - Lightning elemental attacks still lack spectacular traveler
  - Shock status ailment interesting but not enough to save her
  - Physical travelers with lightning exploitation generally better

  RECOMMENDATION:
  - Skip unless dedicated lightning enthusiast
  - Save rubies for better DPS travelers
  - 2.1/5 overall rating
gl_tier: A (8.49 - 7.00)

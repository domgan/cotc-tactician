# Glossary terms - parsed from markdown
unique_mechanics:
- name: Laceration
  description: Status that qualifies as Bleeding for conditional effects and allows attacks that inflict bleeding or increase their potency against a bleeding enemy to exploit any of the bearer’s weaknesses. *Excluding additional effects from support skills or equipment. The exploit effect works only if Laceration was already present before the action.
- name: Deep Wound
  description: Causes the bearer to take 20x damage from Bleeding and raises the potency of some attacks they receive by 15% (does not stack with effects of the same type).
- name: Granted Dagger Weakness
  description: 'Regardless of the source, weakness count adds up (max: 9). If the target was already vulnerable to Dagger, increase damage taken from Dagger by 20%.'
- name: Superburst
  description: When consuming 2 gauges to activate the Ultimate Technique, its damage dealt increases by 50%.


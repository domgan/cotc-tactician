  Wind/Lightning/Dark fan support built around Rancor ("Deep Grudge"). Ultimate marks all foes
  with Rancor (4T), raises all allies' Damage Limit (up to +100,000) and potency by 100%.
  While Rancor is up: front row +20% P.Atk/E.Atk, +20% elemental damage, elemental crits.
  Follow-up AoE wind (2x, 3x vs broken) whenever a front-row ally hits a weakness.
  EX: shield -10 to all foes, disables dodge/zero-damage, 2 stacks Miss Phys/Elem; with Rancor
  30% P.Def/E.Def down with 50% debuff cap. TP skill: shield -2 + 20% P.Atk/E.Atk down.
  TP passive: 10-20% Elem Res down vs broken enemy (passive cap to 50%). Priority front-row heal
  that reaches all allies under Rancor. Ultimate drains 100 SP from all allies and cannot be refreshed.
  A4 accessory: paired ally +100,000 Damage Limit and 10% Elem Res down at full HP.


# Usage Strategy Notes (from YouTube tutorial)
usage_strategy: |
  OVERVIEW:
  - Light and dark apothecary with unique cursed status ailment mechanic
  - Functions mainly as DPS support with shield breaking capabilities
  - Kit is all over the place but decent abilities
  - Highest auto attack stat among apothecaries (no physical attacks)

  KEY MECHANIC - CURSED STATUS AILMENT:
  - New status ailment that grants extra turn for status ailment abilities
  - When inflicted, extends duration of status ailments by 1 turn
  - Enables allies to break shields with status ailment-inflicting abilities
  - Makes past travelers like Jilia/Herminia relevant again

  NOTABLE ABILITIES:
  - 3-hit AoE light/dark attacks with defense/resistance down
  - 3-hit dark attack with combustion (2→5 hits with cursed status)
  - 4-hit AoE with 100% potency up when cursed status present
  - EX skill: 4-hit dark attack + HP/SP regen + ultimate gauge fill
  - Ultimate: 3-hit AoE with 50% potency up + resistance down when cursed

  SUPPORT CAPABILITIES:
  - 15% physical/elemental attack up to front row
  - Additional 15% damage up when cursed enemy present
  - HP/SP restoration and status ailment curing
  - Immunity to status ailments when cursed enemy present

  PASSIVE SYNERGIES:
  - Attacks become elemental dark with critical hit capability
  - AoE cursed status when hitting weaknesses
  - Allies can break shields with status ailment abilities
  - 30% attack/light/dark up when cursed enemy present

  A4 ACCESSORY:
  - 100 E.Atk, 40 SP
  - 50% light/dark damage cap increase
  - Follow-up dark/light attack (potency 100)
  - Decent but not worth chasing specifically

  LONGEVITY:
  - Future travelers with status ailment potency could benefit
  - Status ailment enabler gimmick keeps her relevant
  - 3.25/5 longevity rating

  RECOMMENDATION:
  - Status ailment enabler is her main gimmick
  - Allows past travelers to shine again
  - 3.25/5 overall rating
  - Consider if you need status ailment support

# Glossary terms - parsed from markdown
unique_mechanics:
- name: Combust
  description: Deal elemental damage and lower Shield Points by 1 at the end of the turn (will not break the target).
- name: Frostbite
  description: Deal elemental damage and lower Shield Points by 1 after the target takes action (will not break the target).
- name: Shock
  description: Lower Shield Points by 1 when taking Elem. Lightning damage (will not break the target).
- name: Miss Elem. Attacks
  description: Target fails their next elemental hit. This effect can stack and is consumed only when the enemy tries to deal elemental damage. If the enemy uses a multi-hit elemental attack, it will miss as many hits as stacks of this status had been inflicted.


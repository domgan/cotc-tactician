  Osvald is essentially a better Cyrus but falls off heavily when focusing on specific team comps. His main flaw is that there's only been one relevant boss weak to fire, ice, and lightning all at once (level 120 NPC). He functions more as sub DPS rather than straight elemental DPS since you want to prioritize one or two weaknesses.


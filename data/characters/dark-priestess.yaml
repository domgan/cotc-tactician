# Usage Strategy Notes (from YouTube tutorial)
usage_strategy: |
  PRIMARY ROLE:
  - Support for physical attackers, especially warriors
  - Grants all elemental exploits with ultimate technique
  - Enables old physical travelers to break elemental shields

  KEY SYNERGIES:
  - Dark Knight: Death sentence passive triggers DK's Cursed Puppet mechanic
  - Essential for DK users to maximize damage potential
  - Works well with any physical DPS team

  NOTABLE ABILITIES:
  - Ultimate: 15-35% auto-revive + all allies exploit all elemental weaknesses
  - EX Skill: Auto-revive 25-100% + Fatal Sentence (3-turn countdown) + Necromancy
  - Support Skills: Fire/Ice/Lightning exploits, 15% resist reduction, 50% defense reduction cap
  - First character to lower active defense beyond 30% cap (up to 50%)

  COMPARISON:
  - Better than original Signa with improved skills
  - Makes physical travelers "fantastic or OP"
  - Will be power crept by future support travelers but currently top-tier

  BUILD RECOMMENDATIONS:
  - Ultimate Awakening is sufficient for most players
  - A4 accessory provides valuable 10% elemental resist down
  - Best left at Ultimate Awakening for F2P players

  LONGEVITY:
  - First traveler with all-element exploit support
  - Future travelers will do this better but she'll remain relevant
  - 4.3/5 longevity rating
